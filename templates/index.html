<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VT Scanner (Docker)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">🛡️ Trình Quét VirusTotal</h1>
        
        <div id="selection-area">
            <label class="block text-sm font-medium text-gray-700 mb-2">Chọn hoặc kéo thả tệp cần quét:</label>
            <input type="file" id="fileInput" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-4 border p-2 rounded-lg cursor-pointer">
            
            <button onclick="startScan()" class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200">
                🚀 Tải lên & Quét
            </button>
        </div>

        <div id="loading-area" class="hidden text-center py-6">
            <div class="animate-spin inline-block w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full mb-4"></div>
            <h2 class="text-xl font-semibold text-gray-800">Đang phân tích tệp...</h2>
            <p id="countdown" class="text-red-500 font-bold text-3xl mt-2">60</p>
            <p class="text-sm text-gray-500 mt-2">Vui lòng không đóng trang web</p>
        </div>

        <div id="result-area" class="hidden mt-6">
            <h2 class="text-xl font-bold text-center mb-4 border-b pb-2">Báo Cáo Chi Tiết</h2>
            <div class="grid grid-cols-3 gap-4 text-center mb-6">
                <div class="bg-red-100 p-3 rounded-lg border border-red-300">
                    <p class="text-sm text-red-600 font-semibold">Độc hại</p>
                    <p id="res-mal" class="text-2xl font-bold text-red-600">0</p>
                </div>
                <div class="bg-yellow-100 p-3 rounded-lg border border-yellow-300">
                    <p class="text-sm text-yellow-600 font-semibold">Nghi ngờ</p>
                    <p id="res-sus" class="text-2xl font-bold text-yellow-600">0</p>
                </div>
                <div class="bg-green-100 p-3 rounded-lg border border-green-300">
                    <p class="text-sm text-green-600 font-semibold">An toàn</p>
                    <p id="res-und" class="text-2xl font-bold text-green-600">0</p>
                </div>
            </div>
            <a id="vt-link" href="#" target="_blank" class="block w-full text-center bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-4 rounded-lg">
                🌐 Xem chi tiết trên Web
            </a>
            <button onclick="location.reload()" class="w-full mt-3 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded-lg">
                Quét tệp khác
            </button>
        </div>
    </div>

    <script>
        async function startScan() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return alert("Vui lòng chọn một tệp để quét!");
            const file = fileInput.files[0];

            // Cảnh báo dung lượng (>32MB)
            if (file.size > 32 * 1024 * 1024) {
                if(!confirm("Tệp lớn hơn 32MB có thể bị API miễn phí từ chối. Bạn vẫn muốn tiếp tục?")) return;
            }

            document.getElementById('selection-area').classList.add('hidden');
            document.getElementById('loading-area').classList.remove('hidden');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/scan', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (data.error) {
                    alert("Lỗi: " + data.error);
                    location.reload();
                    return;
                }

                document.getElementById('vt-link').href = `https://www.virustotal.com/gui/file/${data.hash}`;

                let timeLeft = 60;
                const countdownEl = document.getElementById('countdown');
                const timer = setInterval(() => {
                    timeLeft--;
                    countdownEl.innerText = timeLeft;
                    if (timeLeft <= 0) clearInterval(timer);
                }, 1000);

                setTimeout(async () => {
                    const formReport = new FormData();
                    formReport.append('analysis_id', data.analysis_id);
                    
                    const repRes = await fetch('/report', { method: 'POST', body: formReport });
                    const repData = await repRes.json();
                    
                    document.getElementById('loading-area').classList.add('hidden');
                    document.getElementById('result-area').classList.remove('hidden');

                    if(repData.error) {
                        alert("Lỗi khi lấy báo cáo: " + repData.error);
                        return;
                    }

                    document.getElementById('res-mal').innerText = repData.malicious || 0;
                    document.getElementById('res-sus').innerText = repData.suspicious || 0;
                    document.getElementById('res-und').innerText = repData.undetected || 0;

                }, 60000);

            } catch (err) {
                alert("Đã xảy ra lỗi mạng hoặc hệ thống!");
                location.reload();
            }
        }
    </script>
</body>
</html>
