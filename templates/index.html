<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảo Mật | Pháp Môn Tâm Linh</title>
    <link rel="icon" href="static/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F9F7F2',
                        ink: '#5D2E2E',
                        clay: '#8C4A4A',
                        clayHover: '#7A3E3E',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'paper': '0 4px 20px -2px rgba(93, 46, 46, 0.1)',
                        'float': '0 10px 30px -5px rgba(140, 74, 74, 0.4)',
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #F9F7F2; }
        ::-webkit-scrollbar-thumb { background: #8C4A4A; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #7A3E3E; }
        
        /* Ẩn input file mặc định và custom lại nút */
        input[type="file"]::file-selector-button { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-paper text-ink font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-7xl mx-auto w-full flex justify-center">
        
        <div class="w-full max-w-md bg-white rounded-3xl shadow-paper overflow-hidden p-8 transition-all duration-300">
            
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-paper rounded-full mb-3 text-clay overflow-hidden">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="w-full h-full object-contain">
                </div>
                <h1 class="text-2xl font-semibold text-ink">Quét Virus Trực Tuyến</h1>
                <p class="text-sm text-ink/70 mt-1">Phân tích tệp tin và đường liên kết (URL)</p>
            </div>

            <div id="input-area" class="transition-all duration-300">
                
                <div class="flex border-b border-clay/20 mb-6">
                    <button id="tab-file-btn" onclick="switchTab('file')" class="flex-1 py-2 text-sm font-semibold border-b-2 border-clay text-clay transition-all duration-300">
                        <i class="fa-solid fa-file-shield mr-2"></i>Quét Tệp
                    </button>
                    <button id="tab-url-btn" onclick="switchTab('url')" class="flex-1 py-2 text-sm font-semibold border-b-2 border-transparent text-ink/50 hover:text-ink transition-all duration-300">
                        <i class="fa-solid fa-link mr-2"></i>Quét Link
                    </button>
                </div>

                <div id="tab-file-content" class="block">
                    <label class="block text-sm font-medium text-ink mb-3"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>Chọn tệp từ thiết bị:</label>
                    <div class="relative mb-6">
                        <input type="file" id="fileInput" 
                               class="block w-full text-sm text-ink/70 bg-paper rounded-xl border-2 border-dashed border-clay/30 p-2 cursor-pointer hover:border-clay transition-all duration-300
                               file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-white file:text-clay file:shadow-sm hover:file:bg-clay hover:file:text-white">
                    </div>
                    <button onclick="startFileScan()" class="w-full bg-clay text-white font-medium py-3 px-4 rounded-2xl shadow-float hover:-translate-y-1 active:scale-95 transition-all duration-300 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-magnifying-glass"></i> Phân Tích Tệp Ngay
                    </button>
                </div>

                <div id="tab-url-content" class="hidden">
                    <label class="block text-sm font-medium text-ink mb-3"><i class="fa-solid fa-globe mr-2"></i>Nhập đường liên kết (URL):</label>
                    <div class="relative mb-6">
                        <input type="url" id="urlInput" placeholder="Ví dụ: https://trang-web-nghi-ngo.com" 
                               class="block w-full text-sm text-ink bg-paper rounded-xl border border-clay/30 p-4 outline-none focus:border-clay focus:ring-1 focus:ring-clay transition-all duration-300">
                    </div>
                    <button onclick="startUrlScan()" class="w-full bg-clay text-white font-medium py-3 px-4 rounded-2xl shadow-float hover:-translate-y-1 active:scale-95 transition-all duration-300 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-magnifying-glass"></i> Phân Tích Link Ngay
                    </button>
                </div>
            </div>

            <div id="loading-area" class="hidden text-center py-6 transition-all duration-300">
                <div class="relative w-16 h-16 mx-auto mb-6">
                    <div class="absolute inset-0 rounded-full border-4 border-paper"></div>
                    <div class="absolute inset-0 rounded-full border-4 border-clay border-t-transparent animate-spin"></div>
                    <div class="absolute inset-0 flex items-center justify-center text-clay">
                        <i class="fa-solid fa-microchip text-sm"></i>
                    </div>
                </div>
                
                <h2 class="text-lg font-medium text-ink mb-1">Đang tiến hành phân tích...</h2>
                <p class="text-sm text-ink/60 mb-4">Vui lòng không đóng trình duyệt</p>
                
                <div class="bg-paper rounded-xl py-3 px-4 inline-block border border-clay/10">
                    <span class="text-sm text-ink/70 mr-2">Thời gian còn lại:</span>
                    <span id="countdown" class="font-mono text-clay font-bold text-2xl">60</span><span class="font-mono text-clay text-sm">s</span>
                </div>
            </div>

            <div id="result-area" class="hidden mt-2 transition-all duration-300">
                <h2 class="text-lg font-semibold text-center mb-5 text-ink flex items-center justify-center gap-2">
                    <i class="fa-solid fa-clipboard-check text-clay"></i> Báo Cáo Chi Tiết
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-8">
                    <div class="bg-paper p-4 rounded-2xl border border-clay/20 flex flex-col items-center justify-center">
                        <i class="fa-solid fa-bug text-clay mb-2"></i>
                        <p class="text-xs text-ink/80 font-medium uppercase tracking-wider mb-1">Độc hại</p>
                        <p id="res-mal" class="font-mono text-2xl font-bold text-clay">0</p>
                    </div>
                    <div class="bg-paper p-4 rounded-2xl border border-ink/20 flex flex-col items-center justify-center">
                        <i class="fa-solid fa-triangle-exclamation text-ink/70 mb-2"></i>
                        <p class="text-xs text-ink/80 font-medium uppercase tracking-wider mb-1">Nghi ngờ</p>
                        <p id="res-sus" class="font-mono text-2xl font-bold text-ink">0</p>
                    </div>
                    <div class="bg-paper p-4 rounded-2xl border border-green-800/20 flex flex-col items-center justify-center">
                        <i class="fa-solid fa-shield-check text-green-800/70 mb-2"></i>
                        <p class="text-xs text-ink/80 font-medium uppercase tracking-wider mb-1">An toàn</p>
                        <p id="res-und" class="font-mono text-2xl font-bold text-green-800">0</p>
                    </div>
                </div>
                
                <div class="space-y-3">
                    <a id="vt-link" href="#" target="_blank" class="w-full bg-ink text-paper font-medium py-3 px-4 rounded-2xl shadow-md hover:-translate-y-1 active:scale-95 transition-all duration-300 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-globe"></i> Xem trên VirusTotal
                    </a>
                    <button onclick="location.reload()" class="w-full bg-paper text-ink border border-ink/10 font-medium py-3 px-4 rounded-2xl hover:bg-white hover:shadow-sm hover:-translate-y-1 active:scale-95 transition-all duration-300 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-right"></i> Quét Lại
                    </button>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        // Hàm chuyển đổi giao diện Tab (Tệp / URL)
        function switchTab(tabName) {
            const fileBtn = document.getElementById('tab-file-btn');
            const urlBtn = document.getElementById('tab-url-btn');
            const fileContent = document.getElementById('tab-file-content');
            const urlContent = document.getElementById('tab-url-content');

            if (tabName === 'file') {
                fileBtn.className = "flex-1 py-2 text-sm font-semibold border-b-2 border-clay text-clay transition-all duration-300";
                urlBtn.className = "flex-1 py-2 text-sm font-semibold border-b-2 border-transparent text-ink/50 hover:text-ink transition-all duration-300";
                fileContent.classList.remove('hidden');
                urlContent.classList.add('hidden');
            } else {
                urlBtn.className = "flex-1 py-2 text-sm font-semibold border-b-2 border-clay text-clay transition-all duration-300";
                fileBtn.className = "flex-1 py-2 text-sm font-semibold border-b-2 border-transparent text-ink/50 hover:text-ink transition-all duration-300";
                urlContent.classList.remove('hidden');
                fileContent.classList.add('hidden');
            }
        }

        // Logic đếm ngược chung
        let timer;
        function startCountdown(seconds) {
            let timeLeft = seconds;
            const countdownEl = document.getElementById('countdown');
            countdownEl.innerText = timeLeft;
            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                countdownEl.innerText = timeLeft;
                if (timeLeft <= 0) clearInterval(timer);
            }, 1000);
        }

        // 1. Hàm quét Tệp (Đã có sẵn, tinh chỉnh một chút)
        async function startFileScan() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return alert("Vui lòng chọn một tệp để quét!");
            const file = fileInput.files[0];

            const maxSize = 32 * 1024 * 1024; // 32MB
            if (file.size > maxSize) {
                // Hiển thị thông báo dung lượng thực tế
                alert(`⛔ Tệp của Sư huynh quá lớn (${(file.size / 1024 / 1024).toFixed(2)}MB).\nHệ thống chỉ cho phép tải lên tối đa 32MB.`);
                fileInput.value = ""; // Xóa trắng ô nhập liệu để người dùng chọn file khác
                return; // Dừng hàm ngay lập tức, KHÔNG chạy xuống phần hiển thị loading hay gọi API
            }

            document.getElementById('input-area').classList.add('hidden');
            document.getElementById('loading-area').classList.remove('hidden');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/scan', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (data.error) {
                    alert("Lỗi: " + data.error);
                    location.reload();
                    return;
                }

                document.getElementById('vt-link').href = `https://www.virustotal.com/gui/file/${data.hash}`;
                startCountdown(60);

                setTimeout(async () => {
                    const formReport = new FormData();
                    formReport.append('analysis_id', data.analysis_id);
                    
                    const repRes = await fetch('/report', { method: 'POST', body: formReport });
                    const repData = await repRes.json();
                    
                    document.getElementById('loading-area').classList.add('hidden');
                    document.getElementById('result-area').classList.remove('hidden');

                    if(repData.error) {
                        alert("Lỗi khi lấy báo cáo: " + repData.error);
                        return;
                    }

                    document.getElementById('res-mal').innerText = repData.malicious || 0;
                    document.getElementById('res-sus').innerText = repData.suspicious || 0;
                    document.getElementById('res-und').innerText = repData.undetected || 0;

                }, 60000);

            } catch (err) {
                alert("Đã xảy ra lỗi hệ thống! (Chưa kết nối Backend)");
                location.reload();
            }
        }

        async function startUrlScan() {
            // Đổi const thành let để có thể chỉnh sửa lại giá trị urlInput
            let urlInput = document.getElementById('urlInput').value.trim();
            if (!urlInput) return alert("Vui lòng nhập đường liên kết (URL) cần quét!");
            
            // NÂNG CẤP: Tự động chèn http:// nếu người dùng quên gõ
            if (!urlInput.startsWith('http://') && !urlInput.startsWith('https://')) {
                urlInput = 'http://' + urlInput;
                
                // Tự động cập nhật lại ô nhập liệu trên giao diện để người dùng thấy
                document.getElementById('urlInput').value = urlInput;
            }

            document.getElementById('input-area').classList.add('hidden');
            document.getElementById('loading-area').classList.remove('hidden');

            const formData = new FormData();
            formData.append('url', urlInput);

            try {
                // Gọi tới endpoint API quét URL
                const res = await fetch('/scan-url', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (data.error) {
                    alert("Lỗi: " + data.error);
                    location.reload();
                    return;
                }

                // Link báo cáo URL trên VirusTotal
                document.getElementById('vt-link').href = `https://www.virustotal.com/gui/url/${data.url_id}`;
                
                startCountdown(20);

                setTimeout(async () => {
                    const formReport = new FormData();
                    formReport.append('analysis_id', data.analysis_id);
                    
                    // Gọi endpoint lấy báo cáo URL
                    const repRes = await fetch('/report-url', { method: 'POST', body: formReport });
                    const repData = await repRes.json();
                    
                    document.getElementById('loading-area').classList.add('hidden');
                    document.getElementById('result-area').classList.remove('hidden');

                    if(repData.error) {
                        alert("Lỗi khi lấy báo cáo URL: " + repData.error);
                        return;
                    }

                    document.getElementById('res-mal').innerText = repData.malicious || 0;
                    document.getElementById('res-sus').innerText = repData.suspicious || 0;
                    document.getElementById('res-und').innerText = repData.undetected || 0;

                }, 20000);

            } catch (err) {
                alert("Đã xảy ra lỗi hệ thống khi quét URL!");
                location.reload();
            }
        }
    </script>
</body>
</html>
